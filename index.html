<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raw Fusion — Episode Transcripts | King B. Worldwide</title>
<meta name="description" content="Every episode of King B.'s Raw Fusion, transcribed and searchable.">
<style>
:root{--gold:#d4af37;--red:#e03030;--bg:#0a0a0a;--ink:#f2ede4;--mut:#a89e8d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding:28px 20px 80px}
a{color:var(--gold)}a:hover{color:#f0d878}
.crown{text-align:center;font-size:34px;margin:6px 0 0}
h1{font-family:'Playfair Display',Georgia,serif;color:var(--gold);text-align:center;font-weight:700;letter-spacing:1px;margin:6px 0 4px;font-size:clamp(26px,5vw,40px)}
.sub{text-align:center;color:var(--mut);margin:0 0 26px;font-style:italic}
.num{display:inline-block;background:var(--red);color:#fff;font-size:12px;font-family:Arial,sans-serif;padding:2px 10px;border-radius:999px;margin-right:8px;vertical-align:middle}
.card{border-bottom:1px solid #2a2a2a;padding:18px 4px}
.card h2{font-family:'Playfair Display',Georgia,serif;font-size:22px;margin:8px 0 2px;font-weight:400}
.card h2 a{color:var(--ink);text-decoration:none}.card h2 a:hover{color:var(--gold)}
.meta{color:var(--mut);font-size:14px;margin:6px 0 0}
#q{width:100%;padding:12px 16px;font-size:16px;border-radius:999px;border:1px solid #3a3a3a;background:#161616;color:var(--ink);margin:6px 0 20px;font-family:Georgia,serif}
#q::placeholder{color:#6b6257}
footer{margin-top:60px;text-align:center;color:var(--mut);font-size:13px}
</style></head><body><div class="wrap">
<div class="crown">👑</div>
<h1>RAW FUSION TRANSCRIPTS</h1>
<p class="sub">Every episode. Every word. Searchable.</p>
<input id="q" type="search" placeholder="Search episodes — try &quot;dating&quot;, &quot;lawsuit&quot;, &quot;Crucial Conflict&quot;…">
<div id="list"><p class="sub">Loading…</p></div>
<footer><a href="https://kingbworldwide.com">← kingbworldwide.com</a></footer>
</div><script>
const fmtD = s => { try { return new Date(s).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric',timeZone:'UTC'}); } catch(e){ return s; } };
const fmtT = s => { const m = Math.round(parseInt(s||'0',10)/60); return m ? m + ' min' : ''; };
fetch('episodes.json').then(r => r.json()).then(eps => {
  eps.sort((a,b) => b.n - a.n);
  const list = document.getElementById('list');
  list.innerHTML = eps.map(e =>
    `<div class="card"><h2><span class="num">#${e.n}</span><a href="episode.html?ep=${encodeURIComponent(e.slug)}">${e.title}</a></h2>` +
    `<div class="meta">${fmtD(e.date)} · ${fmtT(e.duration)}</div></div>`
  ).join('');
  document.getElementById('q').addEventListener('input', ev => {
    const t = ev.target.value.toLowerCase();
    document.querySelectorAll('.card').forEach(c => {
      c.style.display = c.textContent.toLowerCase().includes(t) ? '' : 'none';
    });
  });
}).catch(() => { document.getElementById('list').innerHTML = '<p class="sub">Could not load episodes.</p>'; });
</script></body></html>
